[package]
name = "voxnexus-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Export OpenAPI and gateway JSON Schema from Rust types"

[lints]
workspace = true

[[bin]]
name = "export-openapi"
path = "src/export_openapi.rs"

[[bin]]
name = "export-events"
path = "src/export_events.rs"

[dependencies]
serde_json = "1"
voxnexus = { path = "../../crates/server" }
voxnexus-protocol = { path = "../../crates/protocol" }
