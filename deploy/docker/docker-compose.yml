name: voxnexus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxnexus}
      POSTGRES_DB: ${POSTGRES_DB:-voxnexus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxnexus} -d ${POSTGRES_DB:-voxnexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-ip.bind=0.0.0.0",
      ]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # Published for host-side cargo run / live tests. Omit in prod-like overlays.
    ports:
      - "8333:8333"

  typesense:
    image: typesense/typesense:27.1
    command:
      [
        "--data-dir",
        "/data",
        "--api-key",
        "${TYPESENSE_API_KEY:-voxnexus-typesense-dev}",
        "--enable-cors",
      ]
    volumes:
      - typesense-data:/data
    ports:
      - "8108:8108"

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      typesense:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voxnexus}:${POSTGRES_PASSWORD:-voxnexus}@postgres:5432/${POSTGRES_DB:-voxnexus}?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voxnexus}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voxnexus-s3-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-voxnexus}
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-voxnexus-typesense-dev}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LISTEN_ADDR: 0.0.0.0:8080
      WEB_DIST: /app/web
      GATEWAY_ALLOW_UNAUTH: ${GATEWAY_ALLOW_UNAUTH:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  typesense-data:
