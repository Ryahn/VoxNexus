# Authentik OIDC overlay (optional, F018O)
#
# Usage (from repo root):
#   docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/compose.authentik.yml --env-file deploy/docker/.env up -d
#
# Prefer running VoxNexus on the host (cargo run / Vite) against this stack so
# OIDC_ISSUER=http://127.0.0.1:9000/... is reachable from both browser and server.
# See apps/site/content/oidc.md.

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in deploy/docker/.env (50+ random chars)}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # Browser-facing origin. Keeps authorize/token URLs on 127.0.0.1 even when the
  # Compose app discovers via host.docker.internal (see OIDC_ISSUER in .env).
  AUTHENTIK_HOST: ${AUTHENTIK_HOST:-http://127.0.0.1:9000}
  AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER:-http://127.0.0.1:9000}
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: postgres
  AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-voxnexus}
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-voxnexus}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-akadmin@example.com}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-change-me-authentik-admin}

services:
  # Idempotent DB create — works on existing Postgres volumes (unlike initdb.d).
  authentik-db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-voxnexus}
      PGPASSWORD: ${POSTGRES_PASSWORD:-voxnexus}
      PGDATABASE: ${POSTGRES_DB:-voxnexus}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until pg_isready -q; do sleep 1; done
        exists=$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'authentik'")
        if [ "$$exists" = "1" ]; then
          echo "authentik database already exists"
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE authentik OWNER \"$${PGUSER}\";"
        echo "created authentik database"
    depends_on:
      postgres:
        condition: service_healthy

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment:
      <<: *authentik-env
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    ports:
      - "9000:9000"
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment:
      <<: *authentik-env
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional: when running the full Compose app (not host cargo run), pass OIDC
  # from .env. Issuer must be reachable from inside the app container — prefer
  # host-run VoxNexus for local testing (see oidc.md).
  app:
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ONLY: ${OIDC_ONLY:-false}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-true}
      OIDC_OUTBOUND_HOST: ${OIDC_OUTBOUND_HOST:-}

volumes:
  authentik-media:
  authentik-certs:
