[package]
name = "voxnexus-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VoxNexus PostgreSQL pool, migrations, and transactions"

[lints]
workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "migrate",
    "macros",
] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
