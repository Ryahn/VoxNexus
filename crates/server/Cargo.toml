[package]
name = "voxnexus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VoxNexus composition root (HTTP, gateway, jobs)"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
openidconnect = { version = "4", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "util",
    "compression-gzip",
    "limit",
    "cors",
    "fs",
    "set-header",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
url = "2"
utoipa = { version = "5", features = ["macros", "axum_extras", "uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7"] }
validator = { version = "0.20", features = ["derive"] }
voxnexus-auth = { path = "../auth" }
voxnexus-config = { path = "../config" }
voxnexus-db = { path = "../db" }
voxnexus-domain = { path = "../domain" }
voxnexus-media = { path = "../media" }
voxnexus-protocol = { path = "../protocol" }
voxnexus-realtime = { path = "../realtime" }
voxnexus-jobs = { path = "../jobs" }
voxnexus-search = { path = "../search" }
voxnexus-storage = { path = "../storage" }

[dev-dependencies]
axum = { version = "0.8" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rsa = { version = "0.9", features = ["pem"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
] }
tempfile = "3"
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v7"] }
