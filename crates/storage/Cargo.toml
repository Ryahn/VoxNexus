[package]
name = "voxnexus-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VoxNexus S3 object storage (SeaweedFS)"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
