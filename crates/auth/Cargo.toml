[package]
name = "voxnexus-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "VoxNexus passwords, sessions, OIDC relying party, and bot tokens"

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
voxnexus-domain = { path = "../domain" }
voxnexus-permissions = { path = "../permissions" }
voxnexus-protocol = { path = "../protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
voxnexus-db = { path = "../db" }
